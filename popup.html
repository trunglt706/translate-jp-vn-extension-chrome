<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { width: 300px; padding: 15px; font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif; }
    h3 { margin-top: 0; color: #4285f4; }
    select,
    input { width: 90%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #4285f4; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    .hint-link { display: inline-block; margin-bottom: 10px; font-size: 12px; text-decoration: none; color: #4285f4; }
    .hint-link:hover { text-decoration: underline; }
    #status { margin-top: 10px; font-size: 12px; }
    .usage-note { margin-top: 12px; padding: 8px 10px; background: #f0f4ff; border-left: 3px solid #4285f4; border-radius: 4px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <h3>⚙️ Cấu hình API Dịch</h3>
  <label for="provider">Nhà cung cấp:</label>
  <select id="provider">
    <option value="gemini">Gemini</option>
    <option value="chatgpt">ChatGPT</option>
  </select>
  <label for="apiKey">Nhập API Key:</label>
  <input type="password" id="apiKey" placeholder="AIza...">
  <a class="hint-link" id="hintGemini" href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener noreferrer">Lấy Gemini key: https://aistudio.google.com/api-keys</a>
  <a class="hint-link" id="hintOpenAI" href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer" style="display:none;">Lấy OpenAI key: https://platform.openai.com/api-keys</a>
  <button id="save">💾 Lưu Key</button>
  <div id="status"></div>
  <div class="usage-note">💡 Giữ <strong>Alt + click</strong> vào phần tử để dịch sang tiếng Việt.</div>
  <script src="popup.js"></script>
</body>
</html>
